
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherX AI | Intelligent Conversational Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              cyber: {
                blue: '#00E5FF',
                green: '#39FF14',
                pink: '#FF007F',
                purple: '#BC13FE',
              }
            },
            boxShadow: {
              'neon-blue': '0 0 15px rgba(0, 229, 255, 0.5), 0 0 30px rgba(0, 229, 255, 0.2)',
              'neon-green': '0 0 15px rgba(57, 255, 20, 0.5), 0 0 30px rgba(57, 255, 20, 0.2)',
              'neon-pink': '0 0 15px rgba(255, 0, 127, 0.5), 0 0 30px rgba(255, 0, 127, 0.2)',
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --neon-blue: #00E5FF;
            --neon-green: #39FF14;
            --neon-pink: #FF007F;
            --neon-purple: #BC13FE;
            --deep-blue: #00B0FF;
            --void-bg: #020203;
            --surface-bg: #0a0a0c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.12);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .light-mode {
            --void-bg: #f8fafc;
            --surface-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--void-bg);
            color: var(--text-main);
            overflow: hidden;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* High-Visibility Neon Glows */
        .glow-blue { box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); }
        .glow-green { box-shadow: 0 0 20px rgba(57, 255, 20, 0.4); }
        .glow-pink { box-shadow: 0 0 20px rgba(255, 0, 127, 0.4); }
        
        .text-glow-blue { text-shadow: 0 0 12px rgba(0, 229, 255, 0.8); }
        .text-glow-green { text-shadow: 0 0 12px rgba(57, 255, 20, 0.8); }
        .text-glow-pink { text-shadow: 0 0 12px rgba(255, 0, 127, 0.8); }

        .glass {
            background: var(--surface-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
        }
        
        .cyber-grid {
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.06) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .cyber-grid::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, var(--void-bg) 95%);
            pointer-events: none;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(57, 255, 20, 0.03), rgba(255, 0, 127, 0.03), transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 50;
        }

        .cyber-corners {
            position: relative;
        }
        .cyber-corners::before, .cyber-corners::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 10;
        }
        .cyber-corners::before {
            top: -2px;
            left: -2px;
            border-top: 3px solid var(--neon-blue);
            border-left: 3px solid var(--neon-green);
        }
        .cyber-corners::after {
            bottom: -2px;
            right: -2px;
            border-bottom: 3px solid var(--neon-pink);
            border-right: 3px solid var(--neon-purple);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--void-bg); }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-blue);
            border-radius: 10px;
            box-shadow: 0 0 5px var(--neon-blue);
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-green); }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.05;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .typing-cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: var(--neon-blue);
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
            box-shadow: 0 0 8px var(--neon-blue);
        }
        
        .streaming-text {
          transition: all 0.2s ease-out;
        }

        /* Visible buttons refinement */
        .btn-neon-green {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
            transition: all 0.3s ease;
        }
        .btn-neon-green:hover {
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.8);
            transform: scale(1.02);
        }

        .btn-neon-blue {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
            transition: all 0.3s ease;
        }
        .btn-neon-blue:hover {
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8);
            transform: scale(1.02);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "jspdf": "https://esm.sh/jspdf@^2.5.1"
  }
}
</script>
</head>
<body class="cyber-grid relative min-h-screen selection:bg-cyber-blue selection:text-black">
    <div class="noise"></div>
    <div class="scanline"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
